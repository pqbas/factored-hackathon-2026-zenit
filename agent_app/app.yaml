command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: LAKEBASE_INSTANCE_NAME
    value: "banking-agent-memory"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql_warehouse"
  - name: BANK_CATALOG
    value: "workspace"
  - name: LLM_ENDPOINT
    value: "databricks-qwen3-next-80b-a3b-instruct"
  # Demo-only default identity for the chat UI (the UI does not send a session token yet).
  - name: DEMO_SESSION_TOKEN
    value: "demo-mx-1"

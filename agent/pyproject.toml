[project]
name = "agent-server"
version = "0.1.0"
description = "MLflow-compatible agent server with FastAPI"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "databricks-langchain[memory]>=0.14.0",
    "databricks-agents",
    "mlflow>=3.9.0",
    "langgraph>=1.0.1",
    "langchain-mcp-adapters>=0.1.11",
    "databricks-mcp>=0.9.2",
    "python-dotenv",
    "psycopg",
    "httpx",
    "pydantic",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pytest>=7.0.0",
]


[project.scripts]
quickstart = "scripts.quickstart:main"
start-server = "src.main:main"
discover-tools = "scripts.discover_tools:main"

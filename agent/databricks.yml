bundle:
  name: agent_langgraph

resources:
  # MLflow experiment for agent tracing - automatically created by bundle
  experiments:
    agent_langgraph_experiment:
      name: /Users/${workspace.current_user.userName}/${bundle.name}-${bundle.target}

  apps:
    agent_langgraph:
      name: "${bundle.target}-agent-langgraph"
      description: "LangGraph agent application"
      source_code_path: ./

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "${resources.experiments.agent_langgraph_experiment.id}"
            permission: 'CAN_MANAGE'
        # Foundation Model endpoint used by the agent (see src/llm/chat.py).
        # Grants CAN_QUERY to the app's service principal so the agent can call
        # the model when deployed. For an on-behalf-of-user (OBO) setup where
        # each user hits the endpoint with their own token, remove this
        # binding and refactor the ChatDatabricks instantiation per the
        # "Advanced: on-behalf-of-user auth" section of agent/README.md.
        - name: 'llm_endpoint'
          serving_endpoint:
            name: 'databricks-qwen3-next-80b-a3b-instruct'
            permission: 'CAN_QUERY'
        # SQL warehouse used to read bank_gold.* and write bank_ops.dispute_cases.
        # The app's service principal also needs UC grants (see data/README.md).
        - name: 'sql_warehouse'
          sql_warehouse:
            id: '07ca55766c9c5097'
            permission: 'CAN_USE'
        # UC-01 general inquiries (agent/uc/bank_uc_consultas.sql), read through the
        # managed MCP server. The functions read bank_gold.* as the caller, so the app's
        # service principal also needs USE CATALOG/SCHEMA and SELECT (scripts/grant_app.sql).
        - name: 'uc_consultas_get_products'
          uc_securable:
            securable_full_name: 'workspace.bank_uc_consultas.get_products'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'uc_consultas_list_transactions'
          uc_securable:
            securable_full_name: 'workspace.bank_uc_consultas.list_transactions'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        # Jev API key, from the secret scope created by hand (see docs/11).
        - name: 'jev_api_key'
          secret:
            scope: 'banking-agent'
            key: 'jev_api_key'
            permission: 'READ'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      apps:
        agent_langgraph:
          name: agent-banking-assistant
          # The back's chat App (dev-bank-assistant-ui) calls /invocations with its service
          # principal's OAuth token (API_PROXY), so that principal needs CAN_USE.
          permissions:
            - level: CAN_USE
              service_principal_name: 046fa618-1a31-4129-b699-4c2bef67dbb7

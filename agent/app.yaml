command: ["uv", "run", "start-server"]
# Agent API only (POST /invocations). The chat UI is a separate app in ../back.
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql_warehouse"
  - name: BANK_CATALOG
    value: "workspace"
  - name: LLM_ENDPOINT
    value: "databricks-qwen3-next-80b-a3b-instruct"
  - name: JEV_API_KEY
    valueFrom: "jev_api_key"

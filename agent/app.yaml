command: ["uv", "run", "start-server"]
# Agent API only (POST /invocations). The chat UI is a separate app in ../back.
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: BANK_CATALOG
    value: "workspace"
  # No MLflow tracing in the App: it has no egress to the storage traces upload to, so every
  # export failed and retried. Observability is pending (Langfuse or LangSmith, see docs/15).
  - name: AGENT_TRACING
    value: "off"
  - name: LLM_ENDPOINT
    value: "databricks-qwen3-next-80b-a3b-instruct"
  # The App has no egress to api.typesafe.ai (Premium plan: no serverless network policies),
  # so it classifies with the LLM; local dev keeps the default, jev.
  - name: CLASSIFIER
    value: "llm"
  - name: JEV_API_KEY
    valueFrom: "jev_api_key"
  # The bank data tools read bank_ro in Lakebase; there is no MCP path.
  - name: LAKEBASE_INSTANCE
    value: "bank-assistant-chat-db"
  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"
  # Demo sessions (token -> bank customer): the 13 demo customers of the
  # evaluation (back/scripts/eval/README.md), the closed and expired ones, and
  # demo-tool-down, whose get_products fails on purpose (case #40, H20).
  - name: DEMO_SESSIONS_JSON
    value: '{"demo-mx-1":{"customer_id":"CLI-FLEUCGTWGAHL","country":"México","expires_at":"2099-01-01T00:00:00Z"},"demo-co-1":{"customer_id":"CLI-7MPS3ZOPSN4Q","country":"Colombia","expires_at":"2099-01-01T00:00:00Z"},"demo-ar-1":{"customer_id":"CLI-714PN0OOE0WX","country":"Argentina","expires_at":"2099-01-01T00:00:00Z"},"demo-mx-2":{"customer_id":"CLI-0IY07CEBUL79","country":"México","expires_at":"2099-01-01T00:00:00Z"},"demo-mx-3":{"customer_id":"CLI-OAZTV7GG5M0D","country":"México","expires_at":"2099-01-01T00:00:00Z"},"demo-co-2":{"customer_id":"CLI-TVX8Q10GJDTW","country":"Colombia","expires_at":"2099-01-01T00:00:00Z"},"demo-ar-2":{"customer_id":"CLI-2MM9EXMOO8KD","country":"Argentina","expires_at":"2099-01-01T00:00:00Z"},"demo-mx-4":{"customer_id":"CLI-01OSDSMM4FX2","country":"México","expires_at":"2099-01-01T00:00:00Z"},"demo-co-3":{"customer_id":"CLI-JLLEM8RQT11E","country":"Colombia","expires_at":"2099-01-01T00:00:00Z"},"demo-ar-3":{"customer_id":"CLI-MO9NTQLU8K63","country":"Argentina","expires_at":"2099-01-01T00:00:00Z"},"demo-ar-4":{"customer_id":"CLI-BTHO9TGJDB68","country":"Argentina","expires_at":"2099-01-01T00:00:00Z"},"demo-mx-5":{"customer_id":"CLI-MA350GCK64W1","country":"México","expires_at":"2099-01-01T00:00:00Z"},"demo-co-4":{"customer_id":"CLI-2UJ5P5LESPCJ","country":"Colombia","expires_at":"2099-01-01T00:00:00Z"},"demo-expired":{"customer_id":"CLI-FLEUCGTWGAHL","country":"México","expires_at":"2020-01-01T00:00:00Z"},"demo-tool-down":{"customer_id":"CLI-FLEUCGTWGAHL","country":"México","expires_at":"2099-01-01T00:00:00Z","fail_tools":["get_products"]},"demo-closed":{"customer_id":"CLI-02Y493OHFA18","country":"Colombia","expires_at":"2099-01-01T00:00:00Z"}}'

command: ["uv", "run", "start-server"]
# Agent API only (POST /invocations). The chat UI is a separate app in ../back.
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: BANK_CATALOG
    value: "workspace"
  - name: LLM_ENDPOINT
    value: "databricks-qwen3-next-80b-a3b-instruct"
  # The App has no egress to api.typesafe.ai (Premium plan: no serverless network policies),
  # so it classifies with the LLM; local dev keeps the default, jev.
  - name: CLASSIFIER
    value: "llm"
  - name: JEV_API_KEY
    valueFrom: "jev_api_key"
  # The bank data tools read bank_ro in Lakebase; there is no MCP path.
  - name: LAKEBASE_INSTANCE
    value: "bank-assistant-chat-db"
  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"
